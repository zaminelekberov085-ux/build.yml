<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#151a2b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Abituriyent Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1320;
        --card: #181d2e;
        --card2: #212739;
        --fg: #f2f4f8;
        --muted: #a6adc0;
        --border: rgba(255, 255, 255, 0.12);
        --primary: #ff7a45;
        --accent: #45c8d8;
        --success: #43c67e;
        --warning: #e8b23a;
      }
      html[data-theme="light"] {
        --bg: #fbf8f5;
        --card: #ffffff;
        --card2: #f2eee9;
        --fg: #1b1e28;
        --muted: #6b7280;
        --border: rgba(0, 0, 0, 0.1);
        --primary: #e0561f;
        --accent: #1f8fa0;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: Manrope, system-ui, sans-serif;
        padding-bottom: 84px;
      }
      h1, h2, h3 { font-family: Sora, system-ui, sans-serif; margin: 0; }
      header {
        position: sticky; top: 0; z-index: 10;
        display: flex; align-items: center; gap: 10px;
        padding: 12px 14px; background: var(--bg); border-bottom: 1px solid var(--border);
      }
      .logo { width: 36px; height: 36px; border-radius: 12px; background: var(--primary); color: #fff;
        display: grid; place-items: center; font-family: Sora; font-weight: 800; }
      .spacer { margin-left: auto; }
      button { font: inherit; color: inherit; cursor: pointer; }
      .btn { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 7px 11px; font-weight: 600; font-size: 13px; }
      .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
      main { padding: 14px; max-width: 720px; margin: 0 auto; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
      .t { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-bottom: 10px; }
      .big { font-family: Sora; font-size: 30px; font-weight: 800; }
      .muted { color: var(--muted); font-size: 13px; }
      .bar { height: 10px; border-radius: 99px; background: var(--card2); overflow: hidden; }
      .bar > i { display: block; height: 100%; border-radius: 99px; transition: width .4s ease; }
      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .grid { display: grid; gap: 10px; }
      .chips { display: flex; gap: 8px; flex-wrap: wrap; }
      .chip { border: 1px solid var(--border); background: transparent; border-radius: 99px; padding: 7px 13px; font-size: 13px; font-weight: 600; }
      .chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
      input, select { font: inherit; background: var(--card2); color: var(--fg); border: 1px solid var(--border);
        border-radius: 10px; padding: 9px 11px; width: 100%; }
      label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
      nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card);
        border-top: 1px solid var(--border); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 20; }
      nav.tabs button { flex: 1; background: none; border: 0; color: var(--muted); font-size: 11px; font-weight: 600; padding: 8px 2px; border-radius: 10px; }
      nav.tabs button[aria-current="true"] { color: var(--primary); }
      .bottle { width: 56px; height: 56px; border-radius: 16px; border: 1px solid var(--border); background: transparent;
        color: var(--muted); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
      .bottle.on { border-color: var(--accent); color: var(--accent); background: rgba(69, 200, 216, .15); }
      .ex { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 10px; }
      .ex > button { display: flex; gap: 10px; align-items: center; width: 100%; background: none; border: 0; padding: 10px; text-align: left; }
      .ex img.thumb { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); }
      .ex .body { border-top: 1px solid var(--border); padding: 12px; }
      .ex .body img { width: 100%; border-radius: 12px; border: 1px solid var(--border); }
      .lv { display: flex; justify-content: space-between; gap: 8px; border: 1px solid var(--border);
        border-radius: 10px; padding: 8px 11px; font-size: 13px; margin-top: 6px; }
      .block { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
      h4 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--primary); }
      ul, ol { margin: 4px 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
      .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; z-index: 50;
        background: var(--card2); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; max-width: 90%; }
    </style>
  </head>

        }
        h += "</div>";

        h += "<div class='card'><div class='t'>" + t("weeklySplit") + "</div>" + SPLIT.map((s) =>
          "<div class='block'><b>" + WD[s.d][L()] + " · " + s.t[L()] + "</b><ul>" +
          s.ex.map((id) => { const e = EX.find((x) => x.id === id); return "<li>" + e.m[L()] + " — " + e.n[L()] + "</li>"; }).join("") +
          "</ul></div>").join("") + "</div>";

        h += "<div class='card'><div class='t'>" + t("guide") + "</div>" + EX.map((e) => {
          const open = openEx === e.id;
          let b = "<div class='ex'><button onclick='toggleEx(\"" + e.id + "\")'><img class='thumb' loading='lazy' src='" + IMG[e.id] +
            "' alt='" + e.n[L()] + "'/><span style='flex:1'><b>" + e.n[L()] + "</b><br/><span class='muted'>" + e.m[L()] + " · " + e.main[L()] + "</span></span><span>" + (open ? "▲" : "▼") + "</span></button>";
          if (open) {
            b += "<div class='body'><img loading='lazy' src='" + IMG[e.id] + "' alt='" + e.n[L()] + "'/>" +
              "<h4>" + t("whyDo") + "</h4><div class='muted'>" + e.why[L()] + "</div>" +
              "<h4>" + t("targets") + "</h4><ul>" + e.tg.map((x) => "<li>" + x[L()] + "</li>").join("") + "</ul>" +
              "<h4>" + t("howTo") + "</h4><ol>" + e.how.map((x) => "<li>" + x[L()] + "</li>").join("") + "</ol>" +
              "<h4>" + t("beginners") + "</h4><div class='muted'>" + e.bg[L()] + "</div>" +
              "<h4>" + t("setsReps") + "</h4>" +
              ["Yeni başlayanlar|Beginner", "Orta səviyyə|Intermediate", "İrəli səviyyə|Advanced"].map((lab, i) =>
                "<div class='lv'><b>" + lab.split("|")[L()] + "</b><span class='muted'>" + e.lv[i] + "</span></div>").join("") +
              "<div class='muted' style='margin-top:10px'>💡 " + e.note[L()] + "</div></div>";
          }
          return b + "</div>";
        }).join("");
        h += "<div class='block'><h4 style='margin-top:0'>" + t("tips") + "</h4><ul>" +
          TIPS.map((x) => "<li>" + x[L()] + "</li>").join("") + "</ul><b>★ " +
          (L() ? "Regular training + good nutrition + enough sleep = results!" : "Mütəmadi məşq + düzgün qidalanma + kifayət qədər yuxu = nəticə!") + "</b></div></div>";
        return h;
      }

      function viewSettings() {
        const perm = ("Notification" in window) ? Notification.permission : "unsupported";
        return "<div class='card'><div class='t'>" + t("settings") + "</div><div class='grid'>" +
          "<div><label>" + t("testGoal") + "</label><input type='number' value='" + S.testGoal + "' onchange='S.testGoal=+this.value;save();render()'/></div>" +
          "<div><label>" + t("waterTarget") + "</label><input type='number' value='" + S.waterTarget + "' onchange='S.waterTarget=+this.value;save();render()'/></div>" +
          "<div><label>" + t("glassMl") + "</label><input type='number' value='" + S.glass + "' onchange='S.glass=+this.value;save();render()'/></div>" +
          "<div><label>" + t("sleepTime") + "</label><input type='time' value='" + S.sleep + "' onchange='S.sleep=this.value;save()'/></div>" +
          "</div></div>" +
          "<div class='card'><div class='t'>" + t("notifications") + "</div>" +
          "<div class='muted' style='margin-bottom:10px'>" + (perm === "granted" ? t("notifOn") : t("notifOff")) + "</div>" +
          "<button class='btn primary' onclick='askNotif()'>" + t("allowNotif") + "</button> " +
          "<button class='btn' onclick='notify(\"Abituriyent Panel\",\"" + (L() ? "Test notification" : "Sınaq bildirişi") + "\")'>" +
          (L() ? "Test notification" : "Bildirişi yoxla") + "</button>" +

          "<div class='muted' style='margin-top:10px'>" + t("offlineNote") + "</div></div>" +
          "<div class='card'><button class='btn' onclick='if(confirm(\"?\")){localStorage.removeItem(KEY);location.reload()}'>" + t("reset") + "</button></div>";
      }

      const TABS = [["today", viewToday], ["tests", viewTests], ["schedule", viewSchedule], ["health", viewHealth], ["settings", viewSettings]];
      function render() {
        document.documentElement.setAttribute("data-theme", S.theme);
        document.documentElement.lang = S.lang;
        document.querySelector("[data-i=tagline]").textContent = t("tagline");
        document.getElementById("langBtn").textContent = S.lang.toUpperCase();
        document.getElementById("view").innerHTML = (TABS.find((x) => x[0] === tab)[1])();
        document.getElementById("tabs").innerHTML = TABS.map((x) =>
          "<button aria-current='" + (tab === x[0]) + "' onclick='go(\"" + x[0] + "\")'>" + t(x[0]) + "</button>").join("");
      }
      function go(x) { tab = x; window.scrollTo(0, 0); render(); }
      function toggleEx(id) { openEx = openEx === id ? null : id; render(); }
      function addT(sub, v) {
        const d = today(); S.tests[d] = S.tests[d] || {};
        S.tests[d][sub] = Math.max(0, (S.tests[d][sub] || 0) + (+v || 0)); save(); render();
      }
      function addW() { setW((S.water[today()] || 0) + S.glass); }
      function setW(v) { S.water[today()] = Math.max(0, v); save(); render(); }
      function cycleW(d) {
        const c = S.workouts[d] || "not_started";
        S.workouts[d] = c === "not_started" ? "in_progress" : c === "in_progress" ? "completed" : "not_started";
        save(); render();
      }
      function addB() {
        const title = document.getElementById("bt").value.trim(); if (!title) return;
        S.blocks.push({ id: String(Date.now()), title: title, start: document.getElementById("bs").value,
          end: document.getElementById("be").value, weekday: +document.getElementById("bw").value,
          subject: document.getElementById("bsu").value });
        save(); render();
      }
      function delB(id) { S.blocks = S.blocks.filter((b) => b.id !== id); save(); render(); }
      document.getElementById("langBtn").onclick = () => { S.lang = S.lang === "az" ? "en" : "az"; save(); render(); };
      document.getElementById("themeBtn").onclick = () => { S.theme = S.theme === "dark" ? "light" : "dark"; save(); render(); };
      window.addEventListener("load", () => {
        render(); tick();
        if ("Notification" in window && Notification.permission === "default") setTimeout(askNotif, 1200);
      });
      render();
    </script>
  </body>
</html>
